name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.15.21
      - run: ruff check src/aria/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirement.txt
          pip install pytest pytest-asyncio pytest-cov
      - name: Run unit tests
        run: |
          pytest tests/ \
            -v --tb=short \
            --cov=src/aria \
            --cov-report=term-missing \
            --cov-fail-under=60

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t aria:test .
      - name: Verify image starts
        run: |
          # config.py constructs ChatGroq at import time, so the app cannot boot
          # without a GROQ_API_KEY — any non-empty value works here because this
          # is a startup smoke test that never calls the LLM.
          # ENVIRONMENT=development is explicit (it is also the code default):
          # with no PostgreSQL reachable, the checkpointer must fall back to
          # MemorySaver instead of raising the production RuntimeError.
          docker run -d --name test-app -p 8000:8000 \
            -e GROQ_API_KEY=dummy-key-for-startup-smoke-test \
            -e ENVIRONMENT=development \
            -e REDIS_HOST=localhost \
            -e POSTGRES_HOST=localhost \
            -e ORACLE_HOST=localhost \
            aria:test
          # Startup waits out a ~30s psycopg pool timeout before the checkpointer
          # falls back, so the probe budget has to comfortably exceed that.
          healthy=""
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/health; then
              healthy=1
              break
            fi
            sleep 3
          done
          docker logs test-app
          if [ -z "$healthy" ]; then
            echo "::error::App did not become healthy within 120s"
            exit 1
          fi
          docker stop test-app
