      sql_response: "SELECT COUNT(*) AS total, SUM(CASE WHEN STATUS IN ('Closed','Resolved') THEN 1 ELSE 0 END) AS resolved FROM AUDIT_FINDINGS"
      sql_result: "[(50, 38)]"
