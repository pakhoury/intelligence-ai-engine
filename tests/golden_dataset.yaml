          content: "Compliance cost = SUM(FINANCIAL_IMPACT) for violations in the department."
      extract_response: "SUM(FINANCIAL_IMPACT) WHERE DEPARTMENT = 'Operations'"
      sql_tables: ["COMPLIANCE_VIOLATIONS"]
