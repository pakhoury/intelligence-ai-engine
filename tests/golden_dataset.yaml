    min_review_score: 7.0

  - id: control_coverage
    question: "What is the control coverage ratio?"
    expected_route: sql_only
    expected_answer_contains:
      - "%"
    mock_data:
      router_response: "SQL_ONLY"
      clarify_response: "NO_CLARIFICATION_NEEDED"
      sql_tables: ["CONTROL_MAPPINGS"]
      sql_schema: "Table: CONTROL_MAPPINGS\nColumns: CONTROL_ID, COMPLIANCE_REQUIREMENT, EFFECTIVE_DATE"
      sql_response: "SELECT COUNT(DISTINCT COMPLIANCE_REQUIREMENT) AS total, COUNT(DISTINCT CASE WHEN EFFECTIVE_DATE <= SYSDATE THEN COMPLIANCE_REQUIREMENT END) AS covered FROM CONTROL_MAPPINGS"
      sql_result: "[(20, 18)]"
      answer_response: "The control coverage ratio is 90% — 18 out of 20 compliance requirements have active controls."
      reviewer_response: "Score: 9.0\nDecision: APPROVED"
    min_review_score: 7.0

  - id: mttr_basic
    question: "What is the mean time to resolution for violations?"
    expected_route: sql_only
    expected_answer_contains:
      - "days"
    mock_data:
      router_response: "SQL_ONLY"
      clarify_response: "NO_CLARIFICATION_NEEDED"
      sql_tables: ["COMPLIANCE_VIOLATIONS"]
      sql_schema: "Table: COMPLIANCE_VIOLATIONS\nColumns: STATUS, VIOLATION_DATE, CLOSURE_DATE"
      sql_response: "SELECT ROUND(AVG(CLOSURE_DATE - VIOLATION_DATE), 1) AS avg_days FROM COMPLIANCE_VIOLATIONS WHERE STATUS = 'Closed'"
      sql_result: "[(32.5,)]"
      answer_response: "The mean time to resolution for closed violations is 32.5 days."
      reviewer_response: "Score: 9.0\nDecision: APPROVED"
    min_review_score: 7.0

  - id: mttr_by_severity
    question: "What is the average resolution time for critical violations?"
    expected_route: sql_only
    expected_answer_contains:
