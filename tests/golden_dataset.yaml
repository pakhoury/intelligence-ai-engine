      sql_response: "SELECT ROUND(AVG(CLOSURE_DATE - VIOLATION_DATE), 1) FROM COMPLIANCE_VIOLATIONS WHERE STATUS = 'Closed' AND SEVERITY = 'Critical'"
      sql_result: "[(15.2,)]"
      answer_response: "Critical violations have an average resolution time of 15.2 days, which is rated as Excellent."
      reviewer_response: "Score: 9.0\nDecision: APPROVED"
    min_review_score: 7.0

