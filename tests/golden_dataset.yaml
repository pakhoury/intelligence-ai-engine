  - id: multi_table_join_question
    question: "Which departments have both open violations and unresolved audit findings?"
    expected_route: sql_only
    expected_answer_contains:
      - "Operations"
    mock_data:
      router_response: "SQL_ONLY"
      clarify_response: "NO_CLARIFICATION_NEEDED"
      sql_tables: ["COMPLIANCE_VIOLATIONS", "AUDIT_FINDINGS"]
      sql_schema: "Table: COMPLIANCE_VIOLATIONS\nColumns: DEPARTMENT, STATUS\nTable: AUDIT_FINDINGS\nColumns: DEPARTMENT, STATUS"
      sql_response: "SELECT DISTINCT v.DEPARTMENT FROM COMPLIANCE_VIOLATIONS v INNER JOIN AUDIT_FINDINGS a ON v.DEPARTMENT = a.DEPARTMENT WHERE v.STATUS != 'Closed' AND a.STATUS NOT IN ('Closed','Resolved')"
      sql_result: "[('Operations',), ('Legal',)]"
      answer_response: "Operations and Legal both have open compliance violations and unresolved audit findings, indicating overlapping risk."
      reviewer_response: "Score: 9.0\nDecision: APPROVED"
    min_review_score: 7.0

